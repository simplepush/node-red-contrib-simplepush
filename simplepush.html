<script type="text/javascript">
    RED.nodes.registerType('simplepush',{
        category: 'function',
        color: '#ffaaaa',
        defaults: {
            account: {value:"", type:"simplepush-account", required:true},
            topic: {value:""},
            member: {value:""},
            broadcast: {value:false},
            title: {value:""},
            message: {value:""},
            attachments: {value:""},
            tag: {value:""},
            actions: {value:""},
            actionTimeout: {value:0},
            autoCommit: {value:true},
            name: {value:""},
            outputs: {value:1},
            // Properties of flows saved by version 1.x. Kept so a deploy does
            // not drop them; the edit dialog moves them into the new fields.
            key: {value:""},
            event: {value:""},
            password: {value:""},
            salt: {value:""}
        },
        inputs:1,
        outputs:1,
        outputLabels: function(index) {
            if (this.actions !== "") {
                actions = this.actions.split(/[ ,]+/).filter(Boolean);
                return actions[index];
            } else {
                return "actionOutput";
            }
        },
        icon: "simplepush.svg",
        label: function() {
            return this.name||"simplepush";
        },
        oneditprepare: function() {
            // Member and broadcast only exist for an organization account. An
            // organization send goes to exactly one of topic, member or
            // broadcast, so broadcast turns the other two off.
            var isOrganization = function() {
                var account = RED.nodes.node($("#node-input-account").val());
                return Boolean(account && account.account === "organization");
            };
            var showTarget = function() {
                var broadcast = isOrganization() && $("#node-input-broadcast").prop("checked");
                $("#node-input-topic, #node-input-member").prop("disabled", broadcast);
            };
            var showAccount = function() {
                $(".simplepush-organization").toggle(isOrganization());
                showTarget();
            };
            showAccount();
            $("#node-input-account").on("change", showAccount);
            $("#node-input-broadcast").on("change", showTarget);

            // Flows saved by version 1.x carry the old key, event and
            // password; show them in their new fields.
            if ($("#node-input-topic").val() === "" && this.key) {
                $("#node-input-topic").val(this.key);
            }
            if ($("#node-input-tag").val() === "" && this.event) {
                $("#node-input-tag").val(this.event);
            }
            if (this.password) {
                $("#simplepush-legacy-password").show();
            }
            if (this.autoCommit === undefined) {
                $("#node-input-autoCommit").prop("checked", true);
            }

            if ($("#node-input-actions").val() !== "") {
                $("#node-input-actionTimeout").prop("disabled", false);
            } else {
                $("#node-input-actionTimeout").prop("disabled", true);
            }

            $("#node-input-actions").on('input', function() {
                if ($("#node-input-actions").val() !== "") {
                    $("#node-input-actionTimeout").prop("disabled", false);
                } else {
                    $("#node-input-actionTimeout").prop("disabled", true);
                }
            });
        },
        oneditsave: function() {
            var node = this;
            node.key = "";
            node.event = "";
            var account = RED.nodes.node($("#node-input-account").val());
            if (!(account && account.account === "organization")) {
                $("#node-input-member").val("");
                $("#node-input-broadcast").prop("checked", false);
            } else if ($("#node-input-broadcast").prop("checked")) {
                $("#node-input-topic").val("");
                $("#node-input-member").val("");
            }
            node.salt = "";
            var actions = $("#node-input-actions").val();
            if (actions !== "") {
                actions = actions.split(/[ ,]+/).filter(Boolean);
                node.outputs = actions.length > 10 ? 10 : actions.length;
            } else {
                node.outputs = 1;
            }
        }
    });
</script>

<script type="text/html" data-template-name="simplepush">
    <div class="form-row">
        <label for="node-input-account"><i class="fa fa-user"></i> Account</label>
        <input type="text" id="node-input-account">
    </div>
    <div class="form-row">
        <label for="node-input-topic"><i class="fa fa-tag"></i> Topic</label>
        <input type="text" id="node-input-topic" placeholder="Leave blank will use msg.topic, or send to your own devices">
    </div>
    <div class="form-row simplepush-organization">
        <label for="node-input-member"><i class="fa fa-user-o"></i> Member</label>
        <input type="text" id="node-input-member" placeholder="Organization member name; Leave blank will use msg.member">
    </div>
    <div class="form-row simplepush-organization">
        <label for="node-input-broadcast"><i class="fa fa-bullhorn"></i> Broadcast</label>
        <input type="checkbox" id="node-input-broadcast" style="display:inline-block; width:auto; vertical-align:top;"> <label for="node-input-broadcast" style="width:auto !important;">Send to every member of the organization</label>
    </div>
    <div class="form-row">
        <label for="node-input-title"><i class="fa fa-align-left"></i> Title</label>
        <input type="text" id="node-input-title" placeholder="Leave blank will use msg.title">
    </div>
    <div class="form-row">
        <label for="node-input-message"><i class="fa fa-align-left"></i> Message</label>
        <input type="text" id="node-input-message" placeholder="Leave blank will use msg.payload">
    </div>
    <div class="form-row">
        <label for="node-input-attachments"><i class="fa fa-paperclip"></i> Attachments</label>
        <input type="text" id="node-input-attachments" placeholder="URLs separated by comma; Leave blank will use msg.attachments">
    </div>
    <div class="form-row">
        <label for="node-input-tag"><i class="fa fa-bookmark"></i> Tag</label>
        <input type="text" id="node-input-tag" placeholder="Leave blank will use msg.tag">
    </div>
    <div class="form-row">
        <label for="node-input-actions"><i class="fa fa-align-left"></i> Actions</label>
        <input type="text" id="node-input-actions" placeholder="Actions separated by comma; Leave blank will use msg.actions">
    </div>
    <div class="form-row">
        <label></label>
        <input type="text" id="node-input-actionTimeout" style="margin-left: 0px; vertical-align: center; width: 50px !important;"> <label style="width:auto !important;" for="node-input-actionTimeout">Timeout in seconds</label>
    </div>
    <div class="form-row">
        <label for="node-input-autoCommit"><i class="fa fa-check"></i> Auto commit</label>
        <input type="checkbox" id="node-input-autoCommit" style="display:inline-block; width:auto; vertical-align:top;"> <label for="node-input-autoCommit" style="width:auto !important;">Complete the task as soon as an action is tapped</label>
    </div>
    <br/>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-tips" id="simplepush-legacy-password" style="display:none">
        This node still carries the password of a version 1.x flow and encrypts with it. Add the topic and its password to the account, which then takes over.
    </div>
</script>

<script type="text/html" data-help-name="simplepush">
    <p>Sends a <a href="https://simplepu.sh" target="_blank">Simplepush</a> task to Android and iOS devices, optionally encrypted and with action buttons whose answer is forwarded to the node's outputs.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">string | object</span></dt>
        <dd>The message of the task. Objects are sent as JSON.</dd>
        <dt class="optional">topic <span class="property-type">string</span></dt>
        <dd>The topic to send to. Without a topic a personal account sends to its own devices.</dd>
        <dt class="optional">member <span class="property-type">string</span></dt>
        <dd>Organization only. The member (by name) the task is sent to.</dd>
        <dt class="optional">broadcast <span class="property-type">boolean</span></dt>
        <dd>Organization only. <code>true</code> sends the task to every member. An organization send needs exactly one of topic, member or broadcast.</dd>
        <dt class="optional">title <span class="property-type">string</span></dt>
        <dd>The title of the task.</dd>
        <dt class="optional">attachments <span class="property-type">array</span></dt>
        <dd>URLs of files (images, videos, documents) that are downloaded and attached to the task. At most 10.</dd>
        <dt class="optional">tag <span class="property-type">string</span></dt>
        <dd>A label the app can group or filter on.</dd>
        <dt class="optional">actions <span class="property-type">array</span></dt>
        <dd>Action buttons shown on the task. The tapped action completes the task and is forwarded to the output.</dd>
        <dt class="optional">timeout <span class="property-type">number</span></dt>
        <dd>Seconds to wait for an action before raising a timeout error. The task expires on the device at the same time. 0 (the default) waits forever.</dd>
        <dt class="optional">autoCommit <span class="property-type">boolean</span></dt>
        <dd>Overrides the Auto commit setting. <code>true</code> completes the task as soon as an action is tapped, <code>false</code> shows a Submit button.</dd>
    </dl>

    <h3>Outputs</h3>
    <p>Only when actions are set. With actions in the node config there is one output per action and the message leaves through the output of the tapped action. With <code>msg.actions</code> there is one output.</p>
    <dl class="message-properties">
        <dt>payload <span class="property-type">string</span></dt>
        <dd>The tapped action.</dd>
        <dt>taskId <span class="property-type">string</span></dt>
        <dd>Id of the task that was answered.</dd>
        <dt>actionSelectedAt <span class="property-type">string</span></dt>
        <dd>When the action was tapped (ISO 8601).</dd>
        <dt>recipient <span class="property-type">object</span></dt>
        <dd>Who answered (<code>publicId</code>, <code>name</code>). For an organization this is the member.</dd>
    </dl>

    <h3>Details</h3>
    <p>Values set in the node config take precedence over the message properties, except <code>msg.autoCommit</code>, which overrides the checkbox.</p>
    <p>The API token or organization integration token, the topic passwords and the Personal Password are set in the Simplepush account the node uses.</p>
</script>
